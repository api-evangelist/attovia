aid: attovia
name: Attovia Therapeutics
description: 'Attovia Therapeutics is a clinical-stage biopharmaceutical company in San
  Carlos, California, founded in 2022 and developing next-generation precision biologics
  for immune-mediated diseases. Its proprietary ATTOBODY platform is a modular protein
  design technology built on biparatopic nanobody scaffolds, used to engineer multispecific
  biologics that inhibit two, three, or four disease-driving pathways from a single molecule
  while targeting improved selectivity, stability, and less frequent dosing than existing
  therapies. The lead program ATTO-1310 is an anti-IL-31 candidate in Phase 1 for chronic
  pruritus and high-itch atopic dermatitis; ATTO-2306 (IL-31 x IL-13) and ATTO-1091 (TL1A
  x IL-23p19 x integrin alpha-4-beta-7, for inflammatory bowel disease) are in IND-enabling
  studies, alongside discovery-stage programs in rheumatology, IBD, and respiratory disease.
  The company raised a $105M Series B led by Goldman Sachs Alternatives and listed on Nasdaq
  as ATTO in August 2026, raising $289M. Attovia publishes no public API, developer portal,
  SDK, or machine-readable specification — its product is therapeutics, not software.'
